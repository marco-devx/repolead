# Override opt-in para GPU (Ada Lovelace, compute capability 8.9 — RTX 40xx):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
# Requiere NVIDIA Container Toolkit. Para otras generaciones cambia el tag:
# turing-latest (75), latest (80), 86-latest (86), hopper-latest (90).
services:
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:89-1.9.4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  leaf-model:
    # Ollama can offload layers to RAM when embeddings occupy part of VRAM.
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
