id: ARCH-CYCLE-001
version: 2
required_evidence: [location, dependency_path]
name: Module dependency cycle
description: >
  A closed import path through two or more modules is a dependency cycle.
  Determine whether it obstructs intended boundaries or initialization; some
  type-only/reexport cycles are harmless. The path is an observed witness,
  not an exhaustive enumeration of all possible cycles.
severity: high
candidate_detectors:
  - module_cycle
llm_judgment:
  question: >
    Is this a real architectural cycle between separate modules, or an artifact
    of module detection (e.g. a package re-exporting types from its own tooling)?
